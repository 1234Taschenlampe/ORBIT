name: Refresh ORBIT APK update index

on:
  push:
    branches: [main]
    paths:
      - 'apks/**'
      - 'apps.json'
      - 'tools/build_updates.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-update-index
  cancel-in-progress: false

jobs:
  index-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ORBIT
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and index available APK files
        run: python tools/build_updates.py
      - name: Commit refreshed update index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- updates.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Refresh ORBIT update index from published APKs"
            git push origin HEAD:main
          fi
